# OpenOCD configuration for STM32H750 on Daisy Seed Rev 4
# Exposes GDB remote interface on localhost:3333 and telnet on localhost:4444

# Adapter: ST-Link or J-Link (CubeIDE uses ST-Link by default)
adapter driver stlink

# Transport: SWD for STM32H7xx
transport select swd

# Set the SWD clock speed (in kHz)
adapter speed 2000

# Target: STM32H750IBK6
source [find target/stm32h7x.cfg]

# Optional: Reduce output verbosity
set _CHIPNAME stm32h750

# Interfaces
telnet_port 4444
gdb_port 3333
