name: DaisyControl
options:
  bundleIdPrefix: com.voelkel
  deploymentTarget:
    macOS: "14.0"

targets:
  DaisyControl:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/DaisyControl
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.voelkel.DaisyControl
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: DaisyControl/DaisyControl.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
